<ng-template #buttonContent>
  <span class="ui-btn-label"><ng-content></ng-content></span>
  <app-ui-icon
    *ngIf="shouldShowExternalIcon"
    name="external-link"
    size="xs"
    class="ui-btn-external-icon"
    [decorative]="true"
  ></app-ui-icon>
  <span *ngIf="shouldShowExternalIcon" class="sr-only">{{ opensInNewTabLabel }}</span>
</ng-template>

<a
  *ngIf="href; else internalLink"
  [class]="linkClasses"
  [href]="href"
  [attr.target]="openInNewTab ? '_blank' : null"
  [attr.rel]="openInNewTab ? 'noreferrer noopener' : null"
  [attr.title]="shouldShowExternalIcon ? opensInNewTabLabel : null"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</a>

<ng-template #internalLink>
  <a [class]="linkClasses" [routerLink]="resolvedRouterLink">
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </a>
</ng-template>
