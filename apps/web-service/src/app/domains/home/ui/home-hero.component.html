<section
  class="grid grid-cols-1 items-center gap-10 lg:grid-cols-[minmax(0,1fr)_minmax(340px,520px)] lg:gap-20 pb-16"
>
  <!-- Left side -->
  <div class="order-1 lg:order-1 max-w-xl self-center space-y-8">
    <div class="space-y-4">
      <div class="flex items-start gap-1">
        <div class="mt-1 flex-shrink-0">
          <img
            *ngIf="profile.avatarUrl; else heroIdentityFallback"
            [src]="profile.avatarUrl"
            [alt]="profile.name || ('common.images.profileAvatar' | translate)"
            class="h-14 w-14 rounded-full border border-stone-300 object-cover shadow-sm"
          />
          <ng-template #heroIdentityFallback>
            <span class="inline-flex h-14 w-14 items-center justify-center rounded-full border border-stone-300 bg-stone-200 text-sm font-semibold text-stone-700 shadow-sm">
              {{ avatarInitials }}
            </span>
          </ng-template>
        </div>

        <div class="space-y-2 pt-1">
          <span class="ui-pill inline-flex px-3 py-1 text-xs">
            {{ profile.location }}
          </span>

          <p class="text-md font-medium ui-text-soft">
            {{ 'pages.home.hero.greeting' | translate:{ name: profile.firstName } }}
          </p>
        </div>
      </div>

      <h1 class="ui-title-display max-w-xl leading-[1.08]">
        {{ profile.heroTitle }}
      </h1>

      <p class="max-w-xl text-base leading-8 ui-text-muted">
        {{ profile.summary }}
      </p>
    </div>

    <div class="space-y-3">
      <p class="text-sm font-semibold ui-text-muted">{{ 'pages.home.hero.coreSkills' | translate }}</p>
      <div class="flex flex-wrap gap-2">
        <app-ui-chip *ngFor="let skill of profile.skills">
          {{ skill }}
        </app-ui-chip>
      </div>
    </div>

     <!-- <div class="flex flex-wrap gap-2">
      <app-ui-chip *ngFor="let label of profile.availability" tone="accent">{{ label }}</app-ui-chip>
    </div> -->

    <div class="flex flex-wrap gap-3">
      <ng-container *ngFor="let action of profile.heroActions">
        <ng-container *ngIf="isHeroCvAction(action); else regularHeroAction">
          <div class="home-hero-cv-action-group" role="group" [attr.aria-label]="'pages.home.hero.cvActions' | translate">
            <button
              type="button"
              class="ui-btn ui-btn-primary home-hero-cv-action home-hero-cv-action--open"
              (click)="openCvPreview($event)"
            >
              <span class="ui-btn-label">{{ 'pages.home.hero.openCv' | translate }}</span>
              <app-ui-icon name="document" size="xs" class="ui-btn-external-icon" [decorative]="true"></app-ui-icon>
            </button>

            <a
              class="ui-btn ui-btn-primary home-hero-cv-action home-hero-cv-action--download"
              [href]="cvDownloadUrl"
              download
              [attr.aria-label]="'pages.home.hero.downloadCv' | translate"
              [attr.title]="'pages.home.hero.downloadCv' | translate"
            >
              <app-ui-icon name="download" size="sm" [decorative]="true"></app-ui-icon>
            </a>
          </div>
        </ng-container>

        <ng-template #regularHeroAction>
          <app-ui-link-button
            [appearance]="action.appearance"
            [href]="action.href ?? null"
            [routerLink]="action.routerLink ?? '/'"
            [openInNewTab]="action.openInNewTab ?? false"
          >
            {{ action.label }}
          </app-ui-link-button>
        </ng-template>
      </ng-container>
    </div>

  </div>

  <!-- Right side -->
  <div class="order-2 lg:order-2 hidden lg:flex items-center justify-center md:justify-end gap-4 ">
    <div class="w-full max-w-[32rem] lg:max-w-[36rem]">
      <div
        class="ui-media-frame ui-floating-media relative aspect-[4/5] w-full overflow-hidden rounded-[0.5rem] p-3"
      >
        <button
          *ngIf="profile.heroImageUrl || profile.avatarUrl; else heroFallback"
          type="button"
          class="home-hero-lightbox-trigger absolute inset-0 overflow-hidden rounded-[0.35rem] text-left"
          (click)="openHeroImage($event)"
          [attr.aria-label]="'common.actions.openLargerImageFor' | translate:{ title: profile.name || profile.heroTitle }"
          [title]="'common.actions.openImage' | translate"
        >
          <img
            [src]="profile.heroImageUrl || profile.avatarUrl"
            [alt]="profile.name || ('common.images.profileImage' | translate)"
            class="h-full w-full object-cover rounded-[0.35rem]"
          />
          <span class="project-detail-modal-image-open-label home-hero-lightbox-label" aria-hidden="true">
            <svg viewBox="0 0 20 20" class="h-3.5 w-3.5" aria-hidden="true" focusable="false">
              <path d="M4.5 6.25A2.25 2.25 0 0 1 6.75 4h6.5a2.25 2.25 0 0 1 2.25 2.25v6.5A2.25 2.25 0 0 1 13.25 15h-6.5a2.25 2.25 0 0 1-2.25-2.25v-6.5Z" fill="none" stroke="currentColor" stroke-width="1.4" />
              <path d="M8.25 8.25h3.5v3.5M11.65 8.35 7.75 12.25" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" />
            </svg>
            <span>{{ 'common.actions.openImage' | translate }}</span>
          </span>
        </button>

        <ng-template #heroFallback>
          <div
            class="ui-media-placeholder absolute inset-3 rounded-[0.4rem] border"
            style="border-color: var(--ui-border-strong);"
          ></div>

          <div
            class="absolute inset-x-10 top-10 bottom-10 rounded-[0.35rem] border border-dashed"
            style="border-color: rgba(120, 113, 108, 0.35); background: rgba(255, 255, 255, 0.2);"
          ></div>
        </ng-template>

        <div
          class="ui-glass-badge absolute left-5 top-5 rounded-full px-3 py-1 text-xs font-semibold"
        >
          {{ profile.firstName }} {{ profile.lastName }}
        </div>
        <!-- <div class="ui-glass-badge absolute bottom-8 left-8 right-8 rounded-3xl p-4">
            <p class="text-sm font-semibold ui-text-strong">{{ profile.headline }}</p>
            <p class="mt-1 text-xs leading-5 ui-text-muted">{{ profile.shortBio }}</p>
          </div> -->
      </div>
    </div>

    <div class="hidden md:flex flex-col items-center gap-3 self-center">
      <a
        *ngIf="profile.resumeUrl"
        [href]="profile.resumeUrl"
        target="_blank"
        rel="noreferrer noopener"
        class="ui-pill ui-hero-social-action flex h-11 w-11 shrink-0 items-center justify-center rounded-md px-0 text-xs"
        [attr.aria-label]="'pages.home.hero.openCv' | translate"
        [attr.title]="'pages.home.hero.cvShort' | translate"
      >
        CV
      </a>

      <a
        *ngFor="let link of socialButtons"
        [href]="link.href"
        [attr.target]="link.openInNewTab ? '_blank' : null"
        [attr.rel]="link.openInNewTab ? 'noreferrer noopener' : null"
        class="ui-pill ui-hero-social-action flex h-11 w-11 shrink-0 items-center justify-center rounded-md px-0 text-xs"
        [attr.aria-label]="link.label"
        [attr.title]="link.label"
      >
        <app-ui-icon [name]="link.iconName" [fallbackText]="link.fallbackText" size="md"></app-ui-icon>
      </a>
    </div>
  </div>
</section>

<app-ui-image-lightbox
  [isOpen]="isHeroImageViewerOpen"
  [images]="heroLightboxImages"
  [title]="profile.name || profile.heroTitle || ('common.images.profileImage' | translate)"
  (closed)="closeHeroImageViewer()"
></app-ui-image-lightbox>

<app-ui-image-lightbox
  [isOpen]="isCvViewerOpen"
  [images]="cvLightboxDocuments"
  [title]="i18nCvTitle"
  (closed)="closeCvViewer()"
></app-ui-image-lightbox>
